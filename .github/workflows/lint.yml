name: Lint and Security Checks

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  check-style:
    name: Clang-Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Format code and show diff
        run: |
          # 1. Find all .c and .h files and format them in-place
          find . -type f \( -name '*.c' -o -name '*.h' \) -exec clang-format -i {} +
          
          # 2. Run git diff. The --exit-code flag will print the diff 
          #    and fail the CI step if any files were changed.
          git diff --color --exit-code

  analyze-codeql:
    name: CodeQL Security Scan
    needs: check-style
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'c-cpp'

      - name: Build Project via Script
        run: |
          chmod +x ./scripts/build.sh
          ./scripts/build.sh

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"