name: Lint and Security Checks

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  check-style:
    name: Clang-Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Format code and show diff
        run: |
          # 1. Find all .c and .h files and format them in-place
          find . -type f \( -name '*.c' -o -name '*.h' \) -exec clang-format -i {} +
          
          # 2. Run git diff. The --exit-code flag will print the diff 
          #    and fail the CI step if any files were changed.
          git diff --color --exit-code

  analyze-cppcheck:
    name: Cppcheck Security Scan
    needs: check-style
    runs-on: ubuntu-latest
    # Notice we REMOVED the "container:" directive here.
    # The job runs on standard Ubuntu to prevent glibc/Node.js crashes.

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 1. Spin up the PS2 container inline to generate compile commands and run Cppcheck
      - name: Run Cppcheck Analysis
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ghcr.io/ps2dev/ps2sdk-ports:latest sh -c "
            # Install cppcheck alongside base dependencies
            apk add --no-cache build-base cmake cppcheck
          
            # Generate compile_commands.json so Cppcheck knows your exact include paths
            cmake -B build -S . -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          
            # Run Cppcheck and pipe output to XML (v2 is required for SARIF converters)
            cppcheck --project=build/compile_commands.json --enable=all --inconclusive --xml --xml-version=2 2> cppcheck-report.xml
          
            # Fix permissions so the Ubuntu runner can read the generated file
            chmod 666 cppcheck-report.xml
          "

      # 2. Convert the Cppcheck XML report into GitHub's required SARIF format
      - name: Convert Cppcheck XML to SARIF
        uses: Flast/cppcheck-sarif@v2
        with:
          input: 'cppcheck-report.xml'
          output: 'cppcheck.sarif'

      # 3. Upload the results directly to the Security > Code Scanning Alerts tab
      - name: Upload Analysis to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'cppcheck.sarif'
          category: 'cppcheck'