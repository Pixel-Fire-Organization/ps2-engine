name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2dev/ps2sdk:latest

    strategy:
      matrix:
        build_type: [debug, release]
        region: [PAL, NTSC]

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          apk add --no-cache build-base git bash cmake

      - name: Build engine (${{ matrix.build_type }}, ${{ matrix.region }})
        run: |
          bash scripts/build.sh ${{ matrix.build_type }} ${{ matrix.region }}

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-${{ matrix.build_type }}-${{ matrix.region }}
          path: exec/main.elf
