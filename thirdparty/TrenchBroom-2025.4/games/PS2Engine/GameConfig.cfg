{
    "version": 9,
    "name": "PS2 Custom Engine",
    "icon": "Icon.png",
    "fileformats": [
        { "format": "Valve", "initialmap": "initial_valve.map" }
    ],
    "filesystem": {
        "searchpath": "resources",
        "packageformat": { "extension": ".pak", "format": "idpak" }
    },
    "materials": {
        "root": "textures",
        "format": { "extensions": [".png", ".tga"], "format": "image" }
    },
    "entities": {
        "definitions": [ "PS2Engine.fgd" ],
        "defaultcolor": "0.4 0.4 0.8 1.0"
    },
    "tags": {
        "brush": [
            {
                "name": "Trigger",
                "attribs": [ "transparent" ],
                "match": "classname",
                "pattern": "trigger_*"
            }
        ],
        "brushface": []
    },
    "faceattribs": {
        "surfaceflags": [],
        "contentflags": []
    }
}